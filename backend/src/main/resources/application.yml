spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quiz_app
    username: postgres
    password: "123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
