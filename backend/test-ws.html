<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket STOMP Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        #log {
            background: #1e1e1e; color: #00ff00; padding: 15px;
            border-radius: 5px; min-height: 200px; font-family: monospace;
            white-space: pre-wrap; margin-top: 20px;
        }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .error { color: #ff4444; }
        .info { color: #aaaaaa; }
    </style>
    <!-- Load the stomp.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h2>🧪 WebSocket (STOMP) Test</h2>
<p>1. Make sure the server is running.</p>
<p>2. Click "Connect" to subscribe to session ID=4.</p>
<p>3. In Postman, send PUT /api/sessions/4/start</p>

<button onclick="connect()">🔌 Connect and subscribe</button>

<div id="log">Waiting for actions...</div>

<script>
    function connect() {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = ''; // Clear the log

        // 1. Create a plain WebSocket connection
        const socket = new WebSocket('ws://localhost:8080/ws');
        const client = Stomp.over(socket);

        // Disable heartbeat to avoid console spam
        client.heartbeat.outgoing = 0;
        client.heartbeat.incoming = 0;

        log('Connecting...', 'info');

        // 2. Connect via STOMP
        client.connect({}, function(frame) {
            log('✅ Successfully connected to STOMP!', 'success');

            // 3. Subscribe to a specific session topic
            // REPLACE '4' WITH A REAL SESSION ID FROM THE DATABASE
            const sessionId = 9;
            const destination = '/topic/session/' + sessionId;

            client.subscribe(destination, function(message) {
                // When a message arrives from the server
                const body = JSON.parse(message.body);
                log('📩 RECEIVED: ' + JSON.stringify(body, null, 2));
            });

            log('📡 Subscribed to: ' + destination, 'info');
        }, function(error) {
            log('❌ Connection error: ' + error, 'error');
        });
    }

    function log(msg, type = '') {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        const cssClass = type === 'error' ? 'error' : (type === 'info' ? 'info' : '');
        logDiv.innerHTML += `<div class="${cssClass}">[${time}] ${msg}</div>`;
    }
</script>
</body>
</html>
